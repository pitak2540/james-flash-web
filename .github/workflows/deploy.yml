name: Deploy PWA + build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------- 1) publish the PWA to GitHub Pages ----------
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------- 2) wrap the PWA as a signed Android APK (TWA) ----------
  apk:
    runs-on: ubuntu-latest
    needs: pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli@1.22.0

      - name: Point Bubblewrap at the runner's JDK + Android SDK (no downloads)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Generate a signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore -alias james \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jamesflash -keypass jamesflash \
            -dname "CN=JAMES Flash, OU=Dev, O=James, L=Bangkok, C=TH"

      - name: Build the TWA
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: jamesflash
          BUBBLEWRAP_KEY_PASSWORD: jamesflash
        run: |
          # Scaffold the Android project from the committed twa-manifest.json, then build.
          yes | bubblewrap init --manifest "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/app/manifest.webmanifest" --directory . || true
          printf 'jamesflash\njamesflash\n' | bubblewrap build --skipPwaValidation || \
            printf 'jamesflash\njamesflash\n' | bubblewrap build
          ls -la *.apk || true

      - name: Collect APK
        run: |
          mkdir -p out
          cp -f app-release-signed.apk out/JAMES-Flash.apk 2>/dev/null || true
          cp -f ./app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          find . -name '*.apk' -maxdepth 4 -exec cp -n {} out/ \; 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: JAMES-Flash-APK
          path: out/*.apk
          if-no-files-found: warn

      - name: Publish APK to a GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          apks=(out/*.apk)
          if [ ${#apks[@]} -gt 0 ]; then
            gh release delete v0.4.0 -y --cleanup-tag 2>/dev/null || true
            gh release create v0.4.0 "${apks[@]}" \
              --title "JAMES Flash v0.4.0 (Android APK)" \
              --notes "ติดตั้งแล้วเปิด ต่อสาย FTDI ผ่าน USB-OTG เพื่อแฟลช K-line (WebUSB). เว็บ: https://pitak2540.github.io/james-flash-web/"
          fi
