name: Deploy PWA + build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------- 1) publish the PWA to GitHub Pages ----------
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------- 2) wrap the PWA as a signed Android APK (TWA) ----------
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli@1.22.0

      - name: Prepare Android SDK + Bubblewrap config
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"; ls "$SDK" || true
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "build-tools;36.1.0" "platforms;android-36" "platforms;android-35" >/dev/null 2>&1 || true
          # Bubblewrap's validatePath() needs a tools/ or bin/ dir directly under the SDK root.
          mkdir -p "$SDK/tools"
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$SDK" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          echo "::warning title=sdkenv::SDK=[$SDK] JAVA_HOME=[$JAVA_HOME] tools=$( [ -d "$SDK/tools" ] && echo y || echo n) cmdline=$( [ -d "$SDK/cmdline-tools" ] && echo y || echo n) bt361=$( [ -d "$SDK/build-tools/36.1.0" ] && echo y || echo n)"

      - name: Generate a signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore -alias james \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jamesflash -keypass jamesflash \
            -dname "CN=JAMES Flash, OU=Dev, O=James, L=Bangkok, C=TH"

      - name: Build the TWA (from the committed twa-manifest.json)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: jamesflash
          BUBBLEWRAP_KEY_PASSWORD: jamesflash
        run: |
          set +e
          # 'yes |' answers the "regenerate project?" confirm (default yes); passwords come from env.
          yes | bubblewrap build --skipPwaValidation > build.log 2>&1
          echo "::warning title=build-exit::exit=$?"
          sed 's/\x1b\[[0-9;]*m//g' build.log | grep -vE '^[[:space:]]*$' | tail -7 | while IFS= read -r l; do echo "::warning::LOG ${l}"; done
          echo "::warning title=apk-list::$(find . -maxdepth 6 -name '*.apk' 2>/dev/null | tr '\n' ',')"
          exit 0

      - name: Collect APK
        run: |
          mkdir -p out
          find . -maxdepth 6 -name '*.apk' -exec cp -n {} out/ \; 2>/dev/null || true
          [ -f app-release-signed.apk ] && cp -f app-release-signed.apk out/JAMES-Flash.apk || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: JAMES-Flash-APK
          path: out/*.apk
          if-no-files-found: warn

      - name: Publish APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          apks=(out/*.apk)
          if [ ${#apks[@]} -gt 0 ]; then
            gh release delete v0.4.0 -y --cleanup-tag 2>/dev/null || true
            gh release create v0.4.0 "${apks[@]}" \
              --title "JAMES Flash v0.4.0 (Android APK)" \
              --notes "ติดตั้งแล้วเปิด ต่อสาย FTDI ผ่าน USB-OTG เพื่อแฟลช K-line (WebUSB). เว็บ: https://pitak2540.github.io/james-flash-web/"
            echo "::warning title=release::created v0.4.0 with ${#apks[@]} apk(s)"
          else
            echo "::warning title=release::no apk produced"
          fi
